name: Build Installer

on:
  workflow_dispatch:
  # Pushing a tag vX.Y.Z also creates a GitHub release with the installer
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # uv downloads Python here; it is then copied to build\python for bundling
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\build\uv-python

jobs:
  build-installer:
    runs-on: windows-latest
    # Bundled versions for the release notes
    outputs:
      installer: ${{ steps.versions.outputs.installer }}
      python: ${{ steps.versions.outputs.python }}
      gamspy: ${{ steps.versions.outputs.gamspy }}
      gams: ${{ steps.gamspy.outputs.gams }}
      veda: ${{ steps.versions.outputs.veda }}
      times: ${{ steps.veda.outputs.times }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        shell: pwsh
        run: |
          # versions.txt holds one "name = version" line per component, each an exact version or "latest"
          $versions = Get-Content versions.txt -Raw | ConvertFrom-StringData
          foreach ($name in "installer", "uv", "python", "gamspy", "veda") {
            if (-not $versions[$name]) { throw "versions.txt has no version for $name" }
            Write-Host "${name}: $($versions[$name])"
            "$name=$($versions[$name])" >> $env:GITHUB_OUTPUT
          }
          if ($versions["installer"] -notmatch '^\d+\.\d+\.\d+$') { throw "The installer version must be X.Y.Z" }
          # Releases must be reproducible and match their tag
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            foreach ($name in "uv", "python", "gamspy", "veda") {
              if ($versions[$name] -eq "latest") { throw "A release needs an exact version for $name in versions.txt" }
            }
            # A minor version like 3.14 would pick whatever patch release is newest
            if ($versions["python"] -notmatch '^\d+\.\d+\.\d+$') { throw "A release needs the Python version as X.Y.Z" }
            if ($env:GITHUB_REF_NAME -ne "v$($versions["installer"])") { throw "Tag $env:GITHUB_REF_NAME does not match installer version $($versions["installer"])" }
          }

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.versions.outputs.uv }}
          # Every installer build starts from scratch
          enable-cache: false

      - name: Install Python
        shell: pwsh
        env:
          VERSION: ${{ steps.versions.outputs.python }}
        run: |
          # Without a version request, uv picks the newest Python; a minor version (e.g. 3.14) picks the newest 3.14.x
          $request = @()
          if ($env:VERSION -ne "latest") { $request = @($env:VERSION) }
          uv python install @request
          if ($LASTEXITCODE -ne 0) { throw "Could not install Python $env:VERSION" }
          $python = uv python find --managed-python @request
          # Copy to a version-independent folder that the installer script expects
          Copy-Item (Split-Path $python) build\python -Recurse
          # The copy is no longer managed by uv; this marker would block installing packages into it
          Remove-Item build\python\Lib\EXTERNALLY-MANAGED
          $python = (Resolve-Path build\python\python.exe).Path
          Write-Host "Using $python"
          "PYTHON=$python" >> $env:GITHUB_ENV

      - name: Install GAMSPy
        id: gamspy
        shell: pwsh
        env:
          VERSION: ${{ steps.versions.outputs.gamspy }}
        run: |
          $package = "gamspy"
          if ($env:VERSION -ne "latest") { $package = "$package==$env:VERSION" }
          uv pip install --python $env:PYTHON --upgrade $package
          if ($LASTEXITCODE -ne 0) { throw "Could not install $package" }
          # The gamspy_base version is the GAMS version
          $gamsVersion = (uv pip show --python $env:PYTHON gamspy_base | Select-String '^Version:\s*(\S+)').Matches[0].Groups[1].Value
          if (-not $gamsVersion) { throw "Could not determine the gamspy_base version" }
          Write-Host "GAMS version: $gamsVersion"
          "gams=$gamsVersion" >> $env:GITHUB_OUTPUT

      - name: Install all GAMSPy solvers
        shell: pwsh
        run: |
          $gamspy = Join-Path (Split-Path $env:PYTHON) "Scripts\gamspy.exe"
          & $gamspy install solver --install-all-solvers

      - name: Download Veda
        id: veda
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.versions.outputs.veda }}
        run: |
          $version = $env:VERSION
          $repo = "kanors-emr/Veda2.0-Installation"
          if ($version -eq "latest") {
            $version = (gh release view --repo $repo --json tagName --jq .tagName).TrimStart("v")
          }
          Write-Host "Downloading Veda $version"
          gh release download "v$version" --repo $repo --pattern "Veda2.0_localhost_$version.zip" --dir build
          if ($LASTEXITCODE -ne 0) { throw "Could not download Veda $version" }
          # The zip contains a top-level Veda folder, so this creates build\Veda
          Expand-Archive "build\Veda2.0_localhost_$version.zip" build
          "VEDA_VERSION=$version" >> $env:GITHUB_ENV
          # The TIMES source folder (e.g. GAMS_SrcTIMES.v4.9.7) comes with Veda
          $src = @(Get-ChildItem build\Veda -Directory -Filter "GAMS_SrcTIMES*")
          if ($src.Count -ne 1) { throw "Expected one GAMS_SrcTIMES* folder in the Veda zip, found $($src.Count)" }
          # initsys.mod contains "$TITLE  TIMES -- VERSION 4.9.7"
          $match = Select-String -Path (Join-Path $src[0].FullName initsys.mod) -Pattern 'TIMES -- VERSION\s+(\S+)' | Select-Object -First 1
          if (-not $match) { throw "Could not determine the TIMES version from initsys.mod" }
          $timesVersion = $match.Matches[0].Groups[1].Value
          Write-Host "TIMES version: $timesVersion"
          "times=$timesVersion" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.versions.outputs.installer }}
        run: |
          # Inno Setup is preinstalled on the Windows runner images
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/O$env:GITHUB_WORKSPACE\build\installer" "/DMyAppVersion=$env:VERSION" "/DVedaVersion=$env:VEDA_VERSION" installer\TIMES_GAMS_Veda.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: TIMES_GAMS_Veda-setup
          path: build/installer/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: TIMES_GAMS_Veda-setup
          path: build/installer

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-installer.outputs.installer }}
          PYTHON_VERSION: ${{ needs.build-installer.outputs.python }}
          GAMSPY_VERSION: ${{ needs.build-installer.outputs.gamspy }}
          GAMS_VERSION: ${{ needs.build-installer.outputs.gams }}
          VEDA_VERSION: ${{ needs.build-installer.outputs.veda }}
          TIMES_VERSION: ${{ needs.build-installer.outputs.times }}
        run: |
          # Release notes are the CHANGELOG.md section of this version, followed by the bundled versions
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^Version $([regex]::Escape($env:VERSION))[ \t]*\r?\n=+[ \t]*\r?\n(.*?)(?=^Version \S+[ \t]*\r?\n=|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no section for version $env:VERSION" }
          $notes = @(
            $match.Groups[1].Value.Trim()
            ""
            "Bundled versions:"
            "- TIMES $env:TIMES_VERSION"
            "- Veda $env:VEDA_VERSION"
            "- GAMS $env:GAMS_VERSION"
            "- GAMSPy $env:GAMSPY_VERSION"
            "- Python $env:PYTHON_VERSION"
          )
          $notes | Set-Content notes.md
          gh release create $env:GITHUB_REF_NAME build/installer/*.exe --verify-tag --title "TIMES/GAMS/Veda $env:VERSION" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $env:GITHUB_REF_NAME" }
